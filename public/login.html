<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — PropCall AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html,body{height:100%}
    body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .adm-wrap{width:100%;max-width:380px}
  </style>
</head>
<body>
<div class="adm-wrap">
  <div class="adm-header">
    <div class="adm-logo">📞</div>
    <div class="adm-title">PropCall AI</div>
    <div class="adm-sub">Danışman girişi</div>
  </div>
  <div class="adm-card adm-form">
    <input type="email" id="emailInput" placeholder="E-posta" autocomplete="username" />
    <input type="password" id="pwInput" placeholder="Şifre" autocomplete="current-password" />
    <button class="adm-btn-block" id="btnLogin">Giriş Yap</button>
    <div class="adm-warn" id="loginErr" style="text-align:center;margin-top:10px;margin-bottom:0"></div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);

  async function doLogin() {
    const email    = $('emailInput').value.trim();
    const password = $('pwInput').value;
    if (!email || !password) {
      $('loginErr').textContent = 'E-posta ve şifre zorunlu';
      $('loginErr').classList.add('show');
      return;
    }
    $('btnLogin').disabled = true;
    $('loginErr').classList.remove('show');
    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const json = await resp.json();
      if (!json.success) throw new Error(json.error || 'Giriş başarısız');
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
    } catch (err) {
      $('loginErr').textContent = err.message;
      $('loginErr').classList.add('show');
      $('btnLogin').disabled = false;
    }
  }

  $('btnLogin').addEventListener('click', doLogin);
  $('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pwInput').focus(); });

  // Zaten girişliyse doğrudan uygulamaya gönder
  fetch('/api/auth/session').then(r => r.json()).then(j => {
    if (j.success) location.href = '/';
  }).catch(() => {});
</script>
</body>
</html>
