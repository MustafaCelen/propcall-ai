<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — PropCall AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html,body{height:100%;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;background:var(--bg);min-height:100vh;padding:20px}
    .login-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:36px 40px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
    .login-logo{width:60px;height:60px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
    .login-title{font-size:22px;font-weight:700;margin-bottom:6px}
    .login-title span{color:var(--primary)}
    .login-sub{font-size:13px;color:var(--tx2);margin-bottom:28px}
    .btn-google{width:100%;background:#fff;color:#111;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:'Sora',sans-serif;text-decoration:none}
    .btn-google:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .btn-google svg{width:20px;height:20px}
    .login-error{margin-top:16px;padding:10px 14px;background:rgba(255,83,112,.1);border:1px solid rgba(255,83,112,.3);border-radius:8px;color:var(--red);font-size:12px;display:none}
    .login-error.show{display:block}
    .login-footer{margin-top:24px;font-size:11px;color:var(--txm);line-height:1.6}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">📞</div>
    <div class="login-title">Prop<span>Call</span> AI</div>
    <div class="login-sub">Emlakçı arama otomasyonu</div>

    <a class="btn-google" href="/auth/google">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google ile Giriş Yap
    </a>

    <div class="login-error" id="err"></div>

    <div class="login-footer">
      Sadece izinli kullanıcılar giriş yapabilir.<br/>
      Erişim için yöneticinize başvurun.
    </div>
  </div>

  <script>
    const errs = {
      no_code:            'Google yanıt vermedi',
      no_token:           'Kimlik doğrulama başarısız',
      no_payload:         'Google hesap bilgisi alınamadı',
      domain_not_allowed: 'Bu e-posta domaini yetkili değil',
      deactivated:        'Hesabınız pasif — yöneticinize başvurun',
      callback_failed:    'Giriş sırasında hata oluştu',
    };
    const p = new URLSearchParams(location.search);
    const e = p.get('error');
    if (e) {
      const el = document.getElementById('err');
      el.textContent = errs[e] || e;
      el.classList.add('show');
    }
  </script>
</body>
</html>
