<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullanıcılar — PropCall AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html,body{height:100%;overflow-y:auto}
    body{background:var(--bg);min-height:100vh;padding:40px 20px}
    .adm-wrap{max-width:820px;margin:0 auto}
    .adm-header{text-align:center;margin-bottom:28px}
    .adm-logo{width:52px;height:52px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
    .adm-title{font-size:20px;font-weight:700}
    .adm-sub{font-size:13px;color:var(--tx2);margin-top:4px}
    .adm-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:16px}
    .adm-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .adm-topbar-links{display:flex;gap:8px}
    .adm-logout, .adm-back{background:transparent;border:1px solid var(--border);color:var(--tx2);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center}
    .adm-logout:hover{border-color:var(--red);color:var(--red)}
    .adm-back:hover{border-color:var(--primary);color:var(--primary)}
    .adm-section-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

    .adm-form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .adm-form-row input{flex:1;min-width:140px;font-size:13px;padding:9px 12px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--tx);font-family:'Sora',sans-serif;outline:none}
    .adm-form-row input:focus{border-color:var(--border-a)}
    .adm-btn{background:var(--primary);color:#000;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s}
    .adm-btn:hover:not(:disabled){opacity:.85}
    .adm-btn:disabled{opacity:.4;cursor:not-allowed}
    .adm-form-err{font-size:12px;color:var(--red);display:none;margin-bottom:10px}
    .adm-form-err.show{display:block}
    .adm-form-ok{font-size:12px;color:var(--primary);display:none;margin-bottom:10px}
    .adm-form-ok.show{display:block}

    table.adm-table{width:100%;border-collapse:collapse;font-size:13px}
    table.adm-table th{text-align:left;font-size:11px;color:var(--txm);text-transform:uppercase;letter-spacing:.4px;padding:0 10px 8px;font-weight:600}
    table.adm-table td{padding:10px;border-top:1px solid var(--border);vertical-align:middle}
    .adm-role-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase}
    .adm-role-tag.admin{background:rgba(0,200,150,.15);color:var(--primary)}
    .adm-role-tag.agent{background:rgba(74,158,255,.15);color:var(--blue)}
    .adm-status-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
    .adm-status-tag.active{background:rgba(0,200,150,.15);color:var(--primary)}
    .adm-status-tag.inactive{background:rgba(255,83,112,.15);color:var(--red)}
    .adm-row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .adm-mini-btn{background:transparent;border:1px solid var(--border);color:var(--tx2);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s}
    .adm-mini-btn:hover{border-color:var(--border-a);color:var(--tx)}
    .adm-mini-btn.danger:hover{border-color:var(--red);color:var(--red)}
    .adm-table-empty{padding:24px;text-align:center;color:var(--txm);font-size:13px}
  </style>
</head>
<body>
<div class="adm-wrap">

  <div class="adm-header">
    <div class="adm-logo">👥</div>
    <div class="adm-title">Kullanıcılar</div>
    <div class="adm-sub">Danışman hesaplarını yönet — sadece yöneticiler görebilir</div>
  </div>

  <div class="adm-topbar">
    <span></span>
    <div class="adm-topbar-links">
      <a class="adm-back" href="/">← Uygulama</a>
      <a class="adm-back" href="/settings">Ayarlarım</a>
      <button class="adm-logout" id="btnLogout">Çıkış</button>
    </div>
  </div>

  <div class="adm-card">
    <div class="adm-section-title">➕ Yeni Danışman Ekle</div>
    <div class="adm-form-err" id="createErr"></div>
    <div class="adm-form-ok" id="createOk"></div>
    <div class="adm-form-row">
      <input type="email" id="newEmail" placeholder="E-posta" />
      <input type="text"  id="newName"  placeholder="Ad Soyad (opsiyonel)" />
      <input type="text"  id="newPassword" placeholder="Geçici şifre" />
      <button class="adm-btn" id="btnCreate">Ekle</button>
    </div>
    <div style="font-size:11px;color:var(--txm)">Danışman ilk girişten sonra şifresini kendi değiştiremez henüz — gerekirse buradan sıfırlayabilirsin.</div>
  </div>

  <div class="adm-card">
    <div class="adm-section-title">📋 Tüm Danışmanlar</div>
    <table class="adm-table">
      <thead>
        <tr><th>E-posta</th><th>Ad</th><th>Rol</th><th>Durum</th><th>Son Giriş</th><th>İşlemler</th></tr>
      </thead>
      <tbody id="usersBody">
        <tr><td colspan="6" class="adm-table-empty">Yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
function $(id) { return document.getElementById(id); }

async function checkSession() {
  const r = await fetch('/api/auth/session');
  if (!r.ok) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
  const j = await r.json();
  if (j.data.role !== 'admin') { location.href = '/'; return; }
  loadUsers();
}

$('btnLogout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/login';
});

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' });
}

async function loadUsers() {
  const r = await fetch('/api/admin/users');
  if (r.status === 401) { location.href = '/login'; return; }
  if (r.status === 403) { location.href = '/'; return; }
  const j = await r.json();
  if (!j.success) return;
  renderUsers(j.data);
}

function renderUsers(users) {
  const tbody = $('usersBody');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="adm-table-empty">Henüz danışman yok</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr data-id="${u.id}">
      <td>${esc(u.email)}</td>
      <td>${esc(u.name || '—')}</td>
      <td><span class="adm-role-tag ${u.role}">${u.role === 'admin' ? 'Admin' : 'Danışman'}</span></td>
      <td><span class="adm-status-tag ${u.isActive ? 'active' : 'inactive'}">${u.isActive ? 'Aktif' : 'Pasif'}</span></td>
      <td>${fmtDate(u.lastLoginAt)}</td>
      <td>
        <div class="adm-row-actions">
          <button class="adm-mini-btn" data-action="toggle">${u.isActive ? 'Devre Dışı Bırak' : 'Aktifleştir'}</button>
          <button class="adm-mini-btn" data-action="reset-pw">Şifre Sıfırla</button>
        </div>
      </td>
    </tr>
  `).join('');

  tbody.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => toggleActive(btn.closest('tr').dataset.id, btn));
  });
  tbody.querySelectorAll('[data-action="reset-pw"]').forEach(btn => {
    btn.addEventListener('click', () => resetPassword(btn.closest('tr').dataset.id));
  });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function toggleActive(id, btn) {
  const row = btn.closest('tr');
  const isActive = row.querySelector('.adm-status-tag').classList.contains('active');
  btn.disabled = true;
  await fetch('/api/admin/users/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ isActive: !isActive }),
  });
  loadUsers();
}

async function resetPassword(id) {
  const pw = prompt('Yeni geçici şifre girin:');
  if (!pw || !pw.trim()) return;
  await fetch('/api/admin/users/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw.trim() }),
  });
  alert('Şifre güncellendi.');
}

$('btnCreate').addEventListener('click', async () => {
  const email = $('newEmail').value.trim();
  const name = $('newName').value.trim();
  const password = $('newPassword').value.trim();
  const errEl = $('createErr');
  const okEl = $('createOk');
  errEl.classList.remove('show');
  okEl.classList.remove('show');

  if (!email || !password) {
    errEl.textContent = 'E-posta ve geçici şifre zorunlu';
    errEl.classList.add('show');
    return;
  }

  $('btnCreate').disabled = true;
  const r = await fetch('/api/admin/users', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, name, password }),
  });
  const j = await r.json();
  $('btnCreate').disabled = false;

  if (!j.success) {
    errEl.textContent = j.error || 'Eklenemedi';
    errEl.classList.add('show');
    return;
  }

  okEl.textContent = '✓ ' + email + ' eklendi';
  okEl.classList.add('show');
  $('newEmail').value = '';
  $('newName').value = '';
  $('newPassword').value = '';
  loadUsers();
});

checkSession();
</script>
</body>
</html>
